server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/crm
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
crm:
  jwt:
    secret: "crm-phase2-secret-key-change-in-production-2026"
    expire-hours: 12
